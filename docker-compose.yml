services:
  torrserver:
    image: ghcr.io/yourok/torrserver:latest
    container_name: torrserver
    ports:
      - "8090:8090"
    environment:
      - TZ=UTC
    restart: unless-stopped

  moisa:
    build: .
    container_name: moisa-addon
    depends_on:
      - torrserver
    ports:
      - "8080:8080"
    environment:
      - TORRENTIO_BASE=https://torrentio.strem.fun
      - PORT=8080
    restart: unless-stopped

  # Optional: TLS reverse proxy for LAN installs into Stremio desktop.
  # See docs/lan-stremio-setup.md for setup instructions.
  moisa-https:
    image: nginx:1.27-alpine
    container_name: moisa-https
    depends_on: [moisa]
    ports: ["8443:8443"]
    volumes:
      - ./nginx-https.conf:/etc/nginx/conf.d/default.conf:ro
      - ~/.moisa-certs:/certs:ro
    restart: unless-stopped

